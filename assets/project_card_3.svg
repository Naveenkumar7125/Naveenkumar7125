<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Outfit:wght@700;900&amp;display=swap');

      .font-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-size: 18px;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }
      .font-tech {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #FFB000;
      }
      .font-desc {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #A5B4FC;
      }
      .font-badge {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 9px;
        fill: #00E7FF;
        letter-spacing: 1px;
      }

      /* Hover Effects */
      .card-container {
        transition: transform 0.3s ease, filter 0.3s ease;
      }
      .card-container:hover {
        transform: translateY(-4px);
        filter: drop-shadow(0 8px 20px rgba(255, 176, 0, 0.12));
      }

      /* Pulsing Screen Glow */
      @keyframes screen-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .screen-glow {
        animation: screen-pulse 3s infinite ease-in-out;
        fill: none;
        stroke: #00E7FF;
        stroke-width: 1.5;
      }

      /* Seat animation */
      @keyframes seat-pulse {
        0%, 100% { fill: #FFB000; }
        50% { fill: #00E7FF; }
      }
      .booking-seat {
        animation: seat-pulse 2s infinite ease-in-out;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06091F" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB000" />
      <stop offset="100%" stop-color="#00E7FF" />
    </linearGradient>

    <radialGradient id="ambience" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 176, 0, 0.15)" />
      <stop offset="100%" stop-color="rgba(5, 8, 22, 0)" />
    </radialGradient>
  </defs>

  <!-- Background (None for Transparency) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Card Group -->
  <g class="card-container" transform="translate(10, 10)">
    <!-- Base Card Graphic -->
    <rect width="830" height="160" rx="15" fill="url(#card-grad)" stroke="url(#border-grad)" stroke-width="1.2" opacity="0.95" />
    <rect width="830" height="160" rx="15" fill="url(#ambience)" />

    <!-- Left Visual Panel: Cinema Seat layout / Screen -->
    <g transform="translate(15, 15)">
      <rect width="130" height="130" rx="10" fill="#030512" stroke="rgba(255, 176, 0, 0.2)" stroke-width="1" />
      <!-- Grid -->
      <path d="M 0 32.5 L 130 32.5 M 0 65 L 130 65 M 0 97.5 L 130 97.5 M 32.5 0 L 32.5 130 M 65 0 L 65 130 M 97.5 0 L 97.5 130" stroke="rgba(255, 176, 0, 0.05)" stroke-width="1" />
      
      <!-- Projection Screen Curve -->
      <path d="M 15 25 Q 65 10 115 25" fill="none" stroke="#00E7FF" stroke-width="2.5" class="screen-glow" />
      <text x="65" y="32" fill="#00E7FF" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">SCREEN</text>
      
      <!-- Cinema Seats Layout (3 rows, 5 columns) -->
      <!-- Row 1 -->
      <rect x="25" y="48" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="42" y="48" width="10" height="10" rx="2" fill="#FFB000" />
      <rect x="60" y="48" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="78" y="48" width="10" height="10" rx="2" fill="#FFB000" />
      <rect x="95" y="48" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>

      <!-- Row 2 -->
      <rect x="25" y="68" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="42" y="68" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="60" y="68" width="10" height="10" rx="2" class="booking-seat" />
      <rect x="78" y="68" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="95" y="68" width="10" height="10" rx="2" fill="#FFB000" />

      <!-- Row 3 -->
      <rect x="25" y="88" width="10" height="10" rx="2" fill="#FFB000"/>
      <rect x="42" y="88" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="60" y="88" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <rect x="78" y="88" width="10" height="10" rx="2" fill="#FFB000"/>
      <rect x="95" y="88" width="10" height="10" rx="2" fill="#252B44" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      
      <!-- Legend -->
      <rect x="27" y="112" width="6" height="6" rx="1" fill="#FFB000" />
      <text x="36" y="117" fill="#A5B4FC" font-family="sans-serif" font-size="6">Taken</text>
      <rect x="62" y="112" width="6" height="6" rx="1" fill="#00E7FF" />
      <text x="71" y="117" fill="#A5B4FC" font-family="sans-serif" font-size="6">Select</text>
      <rect x="97" y="112" width="6" height="6" rx="1" fill="#252B44" />
      <text x="106" y="117" fill="#A5B4FC" font-family="sans-serif" font-size="6">Free</text>
    </g>

    <!-- Right Content Panel -->
    <g transform="translate(165, 20)">
      <!-- Title -->
      <text class="font-title" x="0" y="22">🎟️ CINEMA TICKET BOOKING PORTAL</text>
      
      <!-- Badges -->
      <g transform="translate(365, 6)">
        <!-- Status Badge -->
        <rect x="0" y="0" width="90" height="20" rx="10" fill="rgba(0, 231, 255, 0.1)" stroke="#00E7FF" stroke-width="1" />
        <circle cx="10" cy="10" r="3" fill="#00E7FF">
          <animate attributeName="opacity" values="1; 0.4; 1" dur="1.5s" repeatCount="indefinite" />
        </circle>
        <text class="font-badge" x="20" y="13" fill="#00E7FF">COMPLETED</text>

        <!-- Tech Badge -->
        <rect x="100" y="0" width="70" height="20" rx="10" fill="rgba(255, 176, 0, 0.1)" stroke="#FFB000" stroke-width="1" />
        <text class="font-badge" x="110" y="13" fill="#FFB000">PHP + MySQL</text>
      </g>

      <!-- Description -->
      <text class="font-desc" x="0" y="55">
        A seamless cinema ticketing system implementing dynamic theater seats layout reservation.
      </text>
      <text class="font-desc" x="0" y="73">
        Features real-time availability check, interactive seat states, and relational database records.
      </text>

      <!-- Tech Stack Badges -->
      <g transform="translate(0, 95)">
        <!-- HTML5 / CSS3 -->
        <rect x="0" y="5" width="85" height="22" rx="6" fill="#0D1B2A" stroke="rgba(255, 176, 0, 0.2)" stroke-width="1"/>
        <text class="font-tech" x="42.5" y="20" text-anchor="middle">HTML5 &amp; CSS3</text>

        <!-- JavaScript -->
        <rect x="95" y="5" width="85" height="22" rx="6" fill="#0D1B2A" stroke="rgba(255, 176, 0, 0.2)" stroke-width="1"/>
        <text class="font-tech" x="137.5" y="20" text-anchor="middle">JavaScript</text>

        <!-- PHP -->
        <rect x="190" y="5" width="55" height="22" rx="6" fill="#0D1B2A" stroke="rgba(0, 231, 255, 0.2)" stroke-width="1"/>
        <text class="font-tech" x="217.5" y="20" fill="#00E7FF" text-anchor="middle">PHP</text>

        <!-- MySQL -->
        <rect x="255" y="5" width="65" height="22" rx="6" fill="#0D1B2A" stroke="rgba(0, 231, 255, 0.2)" stroke-width="1"/>
        <text class="font-tech" x="287.5" y="20" fill="#00E7FF" text-anchor="middle">MySQL</text>
      </g>
    </g>

    <!-- Corner styling for cyber vibes -->
    <path d="M 815 15 L 815 25 M 815 15 L 805 15" stroke="#FFB000" stroke-width="1.5" fill="none" />
    <path d="M 815 145 L 815 135 M 815 145 L 805 145" stroke="#00E7FF" stroke-width="1.5" fill="none" />
  </g>
</svg>
