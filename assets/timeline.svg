<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="850" height="350">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Outfit:wght@600;800&amp;display=swap');

      .font-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
      }
      .font-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 400;
      }
      .font-bold {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
      }

      /* Pulse Animation for Nodes */
      @keyframes pulse-ring {
        0% { r: 4px; opacity: 0.3; stroke-width: 1; }
        50% { r: 9px; opacity: 0.9; stroke-width: 2; }
        100% { r: 4px; opacity: 0.3; stroke-width: 1; }
      }

      .pulse-ring-cyan {
        animation: pulse-ring 2.5s infinite ease-in-out;
        stroke: #00E7FF;
        fill: none;
      }
      .pulse-ring-purple {
        animation: pulse-ring 2.8s infinite ease-in-out;
        stroke: #7B61FF;
        fill: none;
      }
      .pulse-ring-gold {
        animation: pulse-ring 3.1s infinite ease-in-out;
        stroke: #FFB000;
        fill: none;
      }

      /* Hover effects on items */
      .timeline-item {
        transition: transform 0.3s ease;
      }
      .timeline-item:hover {
        transform: translateX(8px);
      }
    </style>

    <!-- Gradients for Timeline Track and Borders -->
    <linearGradient id="track-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="30%" stop-color="#7B61FF" />
      <stop offset="70%" stop-color="#FFB000" />
      <stop offset="100%" stop-color="#00E7FF" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(6, 9, 31, 0.85)" />
      <stop offset="100%" stop-color="rgba(2, 4, 10, 0.4)" />
    </linearGradient>
  </defs>

  <!-- Background (None for Markdown Transparency) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Vertical Timeline Track -->
  <line x1="45" y1="20" x2="45" y2="330" stroke="url(#track-gradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Timeline Items -->

  <!-- Item 1: Education (Cyan Node) -->
  <g class="timeline-item" transform="translate(0, 0)">
    <!-- Node Graphic -->
    <circle cx="45" cy="45" r="9" fill="#050816" stroke="#00E7FF" stroke-width="2" />
    <circle class="pulse-ring-cyan" cx="45" cy="45" r="4" />
    <circle cx="45" cy="45" r="3.5" fill="#00E7FF" />

    <!-- Container Card -->
    <rect x="75" y="15" width="750" height="52" rx="10" fill="url(#card-grad)" stroke="rgba(0, 231, 255, 0.15)" stroke-width="1" />
    <!-- Content -->
    <text class="font-title" x="95" y="36" fill="#00E7FF" font-size="14">🎓 EDUCATION</text>
    <text class="font-text" x="220" y="36" fill="#FFFFFF" font-size="13">
      <tspan class="font-bold">Computer Science &amp; Engineering</tspan> Student at Nandha Engineering College
    </text>
    <text class="font-text" x="95" y="54" fill="#A5B4FC" font-size="11" opacity="0.8">Academic Year: Final Year | CGPA: 8.7/10.0</text>
  </g>

  <!-- Item 2: Achievements (Purple Node) -->
  <g class="timeline-item" transform="translate(0, 65)">
    <!-- Node Graphic -->
    <circle cx="45" cy="45" r="9" fill="#050816" stroke="#7B61FF" stroke-width="2" />
    <circle class="pulse-ring-purple" cx="45" cy="45" r="4" />
    <circle cx="45" cy="45" r="3.5" fill="#7B61FF" />

    <!-- Container Card -->
    <rect x="75" y="15" width="750" height="52" rx="10" fill="url(#card-grad)" stroke="rgba(123, 97, 255, 0.15)" stroke-width="1" />
    <!-- Content -->
    <text class="font-title" x="95" y="36" fill="#7B61FF" font-size="14">🏆 HACKATHONS</text>
    <text class="font-text" x="220" y="36" fill="#FFFFFF" font-size="13">
      <tspan class="font-bold">2x Grand Finalist</tspan> at Smart India Hackathon (SIH 2024 &amp; 2025)
    </text>
    <text class="font-text" x="95" y="54" fill="#A5B4FC" font-size="11" opacity="0.8">National level competitive hacking, problem-solving under extreme deadlines.</text>
  </g>

  <!-- Item 3: Experience (Gold Node) -->
  <g class="timeline-item" transform="translate(0, 130)">
    <!-- Node Graphic -->
    <circle cx="45" cy="45" r="9" fill="#050816" stroke="#FFB000" stroke-width="2" />
    <circle class="pulse-ring-gold" cx="45" cy="45" r="4" />
    <circle cx="45" cy="45" r="3.5" fill="#FFB000" />

    <!-- Container Card -->
    <rect x="75" y="15" width="750" height="52" rx="10" fill="url(#card-grad)" stroke="rgba(255, 176, 0, 0.15)" stroke-width="1" />
    <!-- Content -->
    <text class="font-title" x="95" y="36" fill="#FFB000" font-size="14">💻 EXPERIENCE</text>
    <text class="font-text" x="220" y="36" fill="#FFFFFF" font-size="13">
      <tspan class="font-bold">Backend-Focused Full-Stack Developer</tspan>
    </text>
    <text class="font-text" x="95" y="54" fill="#A5B4FC" font-size="11" opacity="0.8">MERN (MongoDB, Express, React, Node.js), REST APIs, WebSockets, PHP, MySQL integrations.</text>
  </g>

  <!-- Item 4: Competitive Coding (Cyan Node) -->
  <g class="timeline-item" transform="translate(0, 195)">
    <!-- Node Graphic -->
    <circle cx="45" cy="45" r="9" fill="#050816" stroke="#00E7FF" stroke-width="2" />
    <circle class="pulse-ring-cyan" cx="45" cy="45" r="4" />
    <circle cx="45" cy="45" r="3.5" fill="#00E7FF" />

    <!-- Container Card -->
    <rect x="75" y="15" width="750" height="52" rx="10" fill="url(#card-grad)" stroke="rgba(0, 231, 255, 0.15)" stroke-width="1" />
    <!-- Content -->
    <text class="font-title" x="95" y="36" fill="#00E7FF" font-size="14">⚡ CODING STREAK</text>
    <text class="font-text" x="220" y="36" fill="#FFFFFF" font-size="13">
      Solved <tspan class="font-bold">750+ Algorithmic Problems</tspan> on LeetCode &amp; GeeksforGeeks
    </text>
    <text class="font-text" x="95" y="54" fill="#A5B4FC" font-size="11" opacity="0.8">Advanced implementations of dynamic programming, graphs, trees, and custom algorithm optimization.</text>
  </g>

  <!-- Item 5: Location / Interests (Purple Node) -->
  <g class="timeline-item" transform="translate(0, 260)">
    <!-- Node Graphic -->
    <circle cx="45" cy="45" r="9" fill="#050816" stroke="#7B61FF" stroke-width="2" />
    <circle class="pulse-ring-purple" cx="45" cy="45" r="4" />
    <circle cx="45" cy="45" r="3.5" fill="#7B61FF" />

    <!-- Container Card -->
    <rect x="75" y="15" width="750" height="52" rx="10" fill="url(#card-grad)" stroke="rgba(123, 97, 255, 0.15)" stroke-width="1" />
    <!-- Content -->
    <text class="font-title" x="95" y="36" fill="#7B61FF" font-size="14">🌍 ORIGIN</text>
    <text class="font-text" x="220" y="36" fill="#FFFFFF" font-size="13">
      Based in <tspan class="font-bold">Erode, Tamil Nadu, India</tspan> — Open to remote and global collaborations
    </text>
    <text class="font-text" x="95" y="54" fill="#A5B4FC" font-size="11" opacity="0.8">Passionate about building backend architecture and integrating AI solutions in web applications.</text>
  </g>
</svg>
